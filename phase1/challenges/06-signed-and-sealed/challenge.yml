name: "Signed and Sealed"
author: SCTF
category: Cloud Storage / Access Control
description: |
  Arugam Waves emails booking receipts as cloud storage links. The links follow
  a very predictable pattern, and the bucket happily serves any object you name —
  it just won't give you a directory listing.

  Start from the receipt link below, notice the naming pattern, and reach the one
  receipt you were never meant to see.

  Start here: __CONNECT__

value: 150
type: dynamic
extra:
  initial: 150
  minimum: 50
  decay: 15

connection_info: __CONNECT__

flags:
  - __FLAG__

hints:
  - content: "Object links can be guessed if they follow a pattern. The receipts are sequential (…-0001, -0002 …). What about the template — number 0000?"
    cost: 0

tags:
  - cloud
  - storage
  - enumeration
  - medium

state: visible
version: "0.1"
