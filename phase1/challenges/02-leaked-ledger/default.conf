server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Misconfiguration under test: dotfiles are served instead of denied,
    # so /.env is fetchable directly. (A hardened site would 404 these.)
    location / {
        try_files $uri $uri/ =404;
    }

    # Serve .env as plain text so it renders in a browser (the "leak").
    location ~ /\.env$ {
        default_type text/plain;
    }
}
