name: "Git Happens"
author: SCTF
category: Web / Source Disclosure
description: |
  Pearl Telecom deploys its developer portal straight from a git repository —
  and the whole .git directory shipped to production along with the site.

  A secret was committed once and "removed" later. Git never forgets.

  Connect: __CONNECT__

value: 100
