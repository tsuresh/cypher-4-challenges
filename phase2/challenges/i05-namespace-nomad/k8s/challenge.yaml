# i05 Namespace Nomad — per-team pair of namespaces so a team can only ever reach
# its OWN records namespace (no cross-team secret enumeration). __TEAM__ and
# __FLAG_B64__ are substituted at provision time.
apiVersion: v1
kind: Namespace
metadata:
  name: records-__TEAM__
---
apiVersion: v1
kind: Namespace
metadata:
  name: apps-__TEAM__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: apps-__TEAM__
---
apiVersion: v1
kind: Secret
metadata:
  name: patient-vault
  namespace: records-__TEAM__
type: Opaque
data:
  flag: __FLAG_B64__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: records-__TEAM__
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["patient-vault"]     # scoped to the one secret (no enumeration)
    verbs: ["get"]
---
# THE FLAW: a RoleBinding in the team's records ns whose subject is a SA from the
# team's apps ns (cross-namespace, but same team -> no cross-team exposure).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-can-read-records
  namespace: records-__TEAM__
subjects:
  - kind: ServiceAccount
    name: worker
    namespace: apps-__TEAM__
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: patient-worker
  namespace: apps-__TEAM__
  labels: { app: patient-worker }
spec:
  serviceAccountName: worker
  automountServiceAccountToken: true
  containers:
    - name: shell
      image: curlimages/curl:8.8.0
      command: ["sh", "-c", "sleep infinity"]
      resources:
        requests: { cpu: "10m", memory: "32Mi" }
        limits:   { cpu: "100m", memory: "64Mi" }
  restartPolicy: Always
