description: |
  Ceylon Kade lets you design your own invoice: type a template, hit preview, and the server
  fills in your order details and renders it. A filter sits in front, swatting away the obvious
  attacks.

  The filter blocks the words everyone tries first. It does not block the idea behind them. Get
  the server to run your code and read the file it's guarding.

