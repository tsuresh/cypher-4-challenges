name: "Serendib Machine"
author: SCTF
category: Reverse Engineering
description: |
  Pearl Telecom ships a little licence-key checker. Open it up and you won't find the check —
  you'll find a machine that runs a program written in an instruction set that doesn't exist on
  any real CPU.

  Learn the machine's language, read the program it runs, and work out the only input it will
  accept.

  File attached: __CONNECT__

