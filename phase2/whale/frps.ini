# frps configuration for ctfd-whale per-team instances.
# The control port (7000) accepts frpc registrations from spawned challenge
# containers; each is exposed on a port in the FRP range (opened by the firewall
# rule cypher-allow-whale). Set a strong token and mirror it in the whale
# settings (see WHALE.md) and in the frpc image the plugin launches.
[common]
bind_port = 7000
# token MUST match the ctfd-whale "frp_api_token"/frpc token — set via .env.
token = __FRP_TOKEN__
# range of ports frps may allocate for per-team direct-TCP instances
allow_ports = 10000-10100
# expose the frp dashboard on loopback only (optional; for debugging on the VM)
dashboard_addr = 127.0.0.1
dashboard_port = 7500
dashboard_user = admin
dashboard_pwd = __FRP_DASH_PWD__
